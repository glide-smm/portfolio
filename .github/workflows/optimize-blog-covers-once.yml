name: Optimize three blog cover images
on:
  push:
    paths:
      - '.github/workflows/optimize-blog-covers-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert current site images to WebP
        run: |
          python -m pip install --quiet Pillow==11.1.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          images = [
              'anticrisis-communication-cover.png',
              'smm-sales-cover.png',
              'smm-results-cover.png'
          ]
          for original in images:
              src = Path(original)
              if not src.is_file():
                  raise SystemExit(f'Missing source image: {src}')
              with Image.open(src) as raw:
                  image = raw.convert('RGB')
                  image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  dst = src.with_suffix('.webp')
                  image.save(dst, 'WEBP', quality=90, method=6)
                  print(f'{src}: {src.stat().st_size} -> {dst.stat().st_size} bytes')
          PY
      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anticrisis-communication-cover.webp smm-sales-cover.webp smm-results-cover.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized WebP versions of three blog cover images'
            git push
          fi
